version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-estik-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app-frontend
      - app-api
    networks:
      - frontend-net

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-estik
    environment:
      POSTGRES_DB: ${DB_NAME:-estik-db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-estik-db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-estik
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_SERVER_JSON_FILE: /pgadmin/servers.json

    ports:
      - "5050:80"
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    networks:
      - backend-net

  app-api:
    build:
      context: ./backend
    container_name: spring-estik-api
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME:-estik-db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SECRET_KEY: ${SECRET_KEY:-sua_secret_aqui}
    networks:
      - frontend-net
      - backend-net

  app-frontend:
    build:
      context: ./frontend 
      args:
        VITE_API_URL: /api
    container_name: frontend-estik
    depends_on:
      - app-api
    networks:
      - frontend-net

  postgres-backup:
    build:
      context: ./backend/backup
    container_name: postgres-estik-backup
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      PGHOST: postgres-db
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-estik-db}
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - backend-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    networks:
      - backend-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning 
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend-net

volumes:
  pgdata:
  pgadmindata:
  grafanadata:
  prometheusdata:
  
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge